<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#111418" />
  <title>GeoDrive — Georgia road map</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Search -->
  <div class="card search" id="searchCard">
    <input id="searchInput" type="search" placeholder="Search, or paste a Google Maps link…" autocomplete="off" />
    <button class="icon-btn" id="clearSearch" title="Clear" hidden>✕</button>
    <ul id="searchResults" class="results" hidden></ul>
  </div>

  <!-- Map controls -->
  <div class="controls">
    <button class="round-btn" id="followBtn" title="Follow my location">◎</button>
    <button class="round-btn" id="view3dBtn" title="3D view">3D</button>
    <button class="round-btn" id="voiceBtn" title="Voice guidance">🔊</button>
    <button class="round-btn" id="updatesBtn" title="Road updates">⚠</button>
    <button class="round-btn" id="themeBtn" title="Day / night map">◐</button>
  </div>

  <!-- Shown when the page cannot start, instead of a blank map -->
  <div class="boot-error" id="bootError" hidden>
    <div class="boot-error-title" id="bootErrorText"></div>
    <div class="boot-error-detail small" id="bootErrorDetail"></div>
    <div class="small muted">Open tesla.jaba.ge/check.html for details about this browser.</div>
  </div>

  <!-- Status toast -->
  <div id="toast" class="toast" hidden></div>

  <!-- Navigation panel -->
  <div class="card route" id="routePanel" hidden>
    <button class="next" id="navSummary" title="Show trip details">
      <div class="next-arrow" id="nextArrow"></div>
      <div class="next-text">
        <div class="next-dist" id="nextDist"></div>
        <div class="next-instr" id="nextInstr"></div>
      </div>
      <span class="chev" id="navChevron" aria-hidden="true"></span>
    </button>

    <div class="then" id="thenRow" hidden>
      <span class="muted small">then</span>
      <span class="then-arrow" id="thenArrow"></span>
      <span class="then-instr" id="thenInstr"></span>
    </div>

    <div class="progress"><div class="progress-bar" id="routeBar"></div></div>

    <div class="route-meta">
      <span id="routeEta"></span>
      <span id="routeDist"></span>
      <span id="routeTime"></span>
    </div>

    <div class="route-actions">
      <button class="btn primary preview-only" id="startNav">Start</button>
      <button class="btn preview-only" id="cancelNav">Cancel</button>
      <button class="btn drive-only" id="stepsToggle">Steps</button>
      <button class="btn danger drive-only" id="endRoute">End</button>
    </div>

    <ol id="stepsList" class="steps" hidden></ol>
  </div>

  <!-- Road updates panel -->
  <aside class="card updates" id="updatesPanel" hidden>
    <header>
      <h2>Road updates</h2>
      <button class="icon-btn" id="closeUpdates" title="Close">✕</button>
    </header>
    <p class="muted" id="updatesMeta"></p>
    <ul id="updatesList" class="updates-list"></ul>
    <footer class="muted small">
      Map © OpenStreetMap contributors · Tiles OpenFreeMap · Terrain Mapzen / AWS · Routing OSRM · Search Photon
    </footer>
  </aside>

  <script src="/boot.js"></script>
</body>
</html>
